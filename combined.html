<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Shift Roster — THC / OCC Combined (HQ + EMS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 9px; width: 9px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .sticky-emp-col {
            position: sticky;
            left: 0;
            z-index: 20;
            box-shadow: 3px 0 8px -3px rgba(15, 23, 42, 0.16);
        }

        .roster-grid {
            border-collapse: collapse;
        }
        .roster-grid th,
        .roster-grid td {
            border: 1px solid #000000;
        }

        .shift-letter {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        /* Exact Cell Fill Patterns from Original Files */
        .pattern-stripes {
            background-image: repeating-linear-gradient(
                90deg,
                #ef4444 0px,
                #ef4444 3px,
                #ffffff 3px,
                #ffffff 6px
            ) !important;
        }
        .pattern-grid {
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.52) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.52) 1px, transparent 1px);
            background-size: 4px 4px;
        }
        .crisp-striped-text {
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.98), 0 0 1px rgba(255, 255, 255, 0.98);
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 6mm;
            }
            html, body {
                background-color: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print, #loginGateOverlay { display: none !important; }
            main {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                width: 100% !important;
            }
            #rosterOuterCard {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                border-radius: 0 !important;
                overflow: visible !important;
                width: 100% !important;
                max-width: none !important;
            }
            .sticky-emp-col {
                position: static !important;
                box-shadow: none !important;
            }
            #rosterScrollContainer {
                overflow: visible !important;
                width: 100% !important;
            }
            #unifiedRosterWrapper {
                transform-origin: top left;
                zoom: var(--print-scale, 0.68);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Login Gate Overlay -->
    <div id="loginGateOverlay" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border-2 border-indigo-600 space-y-4">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 rounded-2xl bg-indigo-700 text-white flex items-center justify-center mx-auto shadow-sm mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <h2 class="text-lg font-black text-slate-900">THC / OCC Combined Roster</h2>
                <p class="text-xs font-semibold text-slate-500">Consolidated Official View (HQ + EMS)</p>
            </div>
            <form id="firebaseLoginForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
                    <input type="text" id="gateUsernameInput" required placeholder="e.g. fawari" autocomplete="username"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" id="gatePasswordInput" required placeholder="••••••••" autocomplete="current-password"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">

    <!-- Main App Wrapper -->
    <div id="protectedAppShell" class="hidden min-h-screen flex flex-col">

        <!-- Top Application Bar -->
        <header class="bg-white border-b border-slate-300 sticky top-0 z-30 shadow-xs no-print">
            <div class="max-w-[1840px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-700 text-white flex items-center justify-center shadow-xs shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <h1 class="text-base sm:text-lg font-extrabold text-slate-900">Combined Shift Roster — THC / OCC (HQ + EMS)</h1>
                            <span id="cloudStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                                <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                <span id="cloudStatusText">Connecting...</span>
                            </span>
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-indigo-50 text-indigo-800 border border-indigo-300">

                        <p id="loggedUserSubtitle" class="text-xs text-slate-500 mt-0.5">Dec 2026 – Dec 2030</p>

                <!-- Navigation & Action Controls -->
                <div class="flex items-center gap-2 flex-wrap">

                    <div class="inline-flex items-center gap-1.5 bg-white px-2 py-1 rounded-xl border border-slate-300">
                        <input type="text" id="empSearchInput" placeholder="Search name..."
                            class="w-24 sm:w-28 px-1.5 py-0.5 text-xs font-semibold text-slate-800 focus:outline-none">
                        <span class="text-slate-300">|</span>
                        <select id="teamFilterSelect"
                            class="py-0.5 pr-1 bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
                            <option value="all">All Teams (HQ + EMS)</option>
                            <option value="hq">HQ Only</option>

                        </select>

                    <button type="button" data-action="print-roster"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition cursor-pointer">

                    </button>

                    <button type="button" data-action="export-csv"

                        <span>📥 Export CSV</span>

                    <button type="button" data-action="sign-out"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-xs transition cursor-pointer">

        </header>

        <!-- Main Workspace -->
        <main class="w-full px-2 sm:px-6 py-4 space-y-3.5 flex-1 flex flex-col items-center">
            <section id="rosterOuterCard" style="width: fit-content; max-width: 100%;" class="bg-white rounded-2xl border border-slate-300 shadow-sm p-3 sm:p-4 overflow-hidden">
                <div id="rosterScrollContainer" class="w-full overflow-x-auto custom-scrollbar pb-1.5">
                    <div id="unifiedRosterWrapper" class="inline-block min-w-max"></div>

    <script>
        (function () {
            "use strict";

            // ضع مفتاح apiKey الحقيقي الخاص بمشروع leave-2027 مكان "APIKEY"
            const firebaseConfig = {
                apiKey: "AIzaSyA731dlhUgqoMGG7J_GUBn_H7vxvEPchms",
                authDomain: "leave-2027.firebaseapp.com",
                databaseURL: "https://leave-2027-default-rtdb.firebaseio.com",
                projectId: "leave-2027",
                storageBucket: "leave-2027.firebasestorage.app",
                messagingSenderId: "704005666346",
                appId: "1:704005666346:web:02ccdf6182c834ad85b553",
                measurementId: "G-K3KGCM517L"
            };

            const HQ_DB_PATH = "monthly_roster_occ_thc";
            const EMS_DB_PATH = "monthly_roster_occ_ems";
            const AUTH_DOMAIN_SUFFIX = "@occ.local";
            const CORE_COUNTER_CODES = ["A", "B", "C"];
            const ACTIVE_SHIFT_CODES = ["A", "B", "C", "D"];
            const WEEKEND_DAYS = [5, 6]; // Friday & Saturday

            const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const DAYS_TWO_LETTER = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

            const DEFAULT_CODES = [
                { code: "A",  label: "07:00-15:00",      color: "#fff59d", textColor: "#000000", pattern: "solid",   core: true },
                { code: "B",  label: "15:00-23:00",      color: "#bae6fd", textColor: "#000000", pattern: "solid",   core: true },
                { code: "C",  label: "23:00-07:00",      color: "#9ca3af", textColor: "#000000", pattern: "solid",   core: true },
                { code: "D",  label: "10:00-18:00",      color: "#fed7aa", textColor: "#000000", pattern: "solid",   core: false },
                { code: "O",  label: "Office duty",      color: "#60a5fa", textColor: "#000000", pattern: "solid",   core: false },
                { code: "S",  label: "Sick",             color: "#ef4444", textColor: "#000000", pattern: "stripes", core: false },
                { code: "V",  label: "Vacation",         color: "#fbcfe8", textColor: "#000000", pattern: "solid",   core: false },
                { code: "T",  label: "Training / Test",  color: "#1e3a8a", textColor: "#ffffff", pattern: "solid",   core: false },
                { code: "MT", label: "Meeting / Task",   color: "#f59e0b", textColor: "#000000", pattern: "solid",   core: false },
                { code: "E",  label: "Family reason",    color: "#dc2626", textColor: "#ffffff", pattern: "grid",    core: false },
                { code: "SW", label: "Shift Swap",       color: "#2563eb", textColor: "#ffffff", pattern: "solid",   core: false },
                { code: "CD", label: "Compensation Day", color: "#475569", textColor: "#ffffff", pattern: "solid",   core: false }
            ];

            const state = {
                currentMonthKey: "2026-12",
                teamFilter: "all",
                searchQuery: "",
                hqPublished: null,
                emsPublished: null
            };

            let authInstance = null;
            let dbInstance = null;
            let currentUsername = "";

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function getContrastTextColor(hex) {
                const clean = String(hex || "#ffffff").replace("#", "");
                if (clean.length !== 6) return "#000000";
                const r = parseInt(clean.substring(0, 2), 16);
                const g = parseInt(clean.substring(2, 4), 16);
                const b = parseInt(clean.substring(4, 6), 16);
                const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                return luminance > 0.56 ? "#000000" : "#ffffff";
            }

            function resolveCodeTextColor(codeObj) {
                if (codeObj && /^#[0-9A-Fa-f]{6}$/.test(String(codeObj.textColor || ""))) {
                    return String(codeObj.textColor);
                }
                if (codeObj && String(codeObj.code).toUpperCase() === "S") {
                    return "#000000";
                }
                return getContrastTextColor(codeObj ? codeObj.color : "#ffffff");
            }

            function getPatternClass(pattern) {
                if (pattern === "stripes" || pattern === "v-stripes") return "pattern-stripes";
                if (pattern === "grid") return "pattern-grid";
                return "";
            }

            function parseMonthKey(monthKey) {
                const parts = String(monthKey || "2026-12").split("-");
                const year = Math.max(2026, Math.min(2030, Number(parts[0]) || 2026));
                let monthIndex = Math.max(0, Math.min(11, (Number(parts[1]) || 12) - 1));
                if (year === 2026 && monthIndex < 11) {
                    monthIndex = 11;
                }
                return { year, monthIndex };
            }

            function normalizeRosterMonthKey(monthKey) {
                const { year, monthIndex } = parseMonthKey(monthKey);
                return year + "-" + String(monthIndex + 1).padStart(2, "0");
            }

            function formatMonthBadge(monthKey) {
                const { year, monthIndex } = parseMonthKey(monthKey);
                return MONTHS_SHORT[monthIndex] + "-" + String(year).slice(-2);
            }

            function getDaysInMonthKey(monthKey) {
                const { year, monthIndex } = parseMonthKey(monthKey);
                const count = new Date(year, monthIndex + 1, 0).getDate();
                const days = [];
                for (let d = 1; d <= count; d++) {
                    const dow = new Date(year, monthIndex, d).getDay();
                    days.push({
                        day: d,
                        dow: dow,
                        abbr: DAYS_TWO_LETTER[dow],
                        isWeekend: WEEKEND_DAYS.includes(dow)
                    });
                }
                return days;
            }

            function populateMonthSelectDropdown(selectedYear) {
                const monthSel = document.getElementById("monthPartSelect");
                if (!monthSel) return;
                const yNum = Number(selectedYear) || 2026;
                const startIdx = yNum === 2026 ? 11 : 0;
                const opts = [];
                for (let idx = startIdx; idx < 12; idx++) {
                    const mVal = String(idx + 1).padStart(2, "0");
                    opts.push(`<option value="${mVal}">${MONTHS_FULL[idx]} (${MONTHS_SHORT[idx]})</option>`);
                }
                monthSel.innerHTML = opts.join("");
            }

            function syncDateNavigatorInputs() {
                state.currentMonthKey = normalizeRosterMonthKey(state.currentMonthKey);
                const parts = state.currentMonthKey.split("-");
                const yStr = parts[0];
                const mStr = parts[1];

                const yearSel = document.getElementById("yearPartSelect");
                const monthSel = document.getElementById("monthPartSelect");
                if (yearSel && yearSel.value !== yStr) yearSel.value = yStr;

                populateMonthSelectDropdown(yStr);
                if (monthSel) monthSel.value = mStr;

                const prevBtn = document.getElementById("prevMonthBtn");
                const nextBtn = document.getElementById("nextMonthBtn");
                if (prevBtn) prevBtn.disabled = (state.currentMonthKey === "2026-12");
                if (nextBtn) nextBtn.disabled = (state.currentMonthKey === "2030-12");
            }

            function updateStatusBadge(mode) {
                const badge = document.getElementById("cloudStatusBadge");
                const dot = document.getElementById("cloudStatusDot");
                const text = document.getElementById("cloudStatusText");
                if (!badge || !dot || !text) return;

                if (mode === "connected") {
                    badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
                    dot.className = "w-2 h-2 rounded-full bg-emerald-500";
                    text.textContent = "Live Cloud Sync";
                } else {
                    badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200";
                    dot.className = "w-2 h-2 rounded-full bg-amber-500";
                    text.textContent = "Offline";
                }
            }

            function extractDepartmentData(pubObj, monthKey) {
                const defaultRes = {
                    employees: [],
                    assignments: {},
                    counterRows: [],
                    version: "-",
                    codes: JSON.parse(JSON.stringify(DEFAULT_CODES))
                };
                if (!pubObj || typeof pubObj !== "object") return defaultRes;

                let codesList = JSON.parse(JSON.stringify(DEFAULT_CODES));
                if (Array.isArray(pubObj.codes) && pubObj.codes.length > 0) {
                    codesList = pubObj.codes.filter(c => c && c.code).map(c => {
                        const codeUpper = String(c.code).toUpperCase().slice(0, 3);
                        const validBg = /^#[0-9A-Fa-f]{6}$/.test(String(c.color)) ? String(c.color) : "#e2e8f0";
                        const validText = /^#[0-9A-Fa-f]{6}$/.test(String(c.textColor || ""))
                            ? String(c.textColor)
                            : (codeUpper === "S" ? "#000000" : getContrastTextColor(validBg));
                        const patNorm = (c.pattern === "stripes" || c.pattern === "v-stripes")
                            ? "stripes"
                            : (c.pattern === "grid" ? "grid" : "solid");
                        return {
                            code: codeUpper,
                            label: String(c.label || codeUpper),
                            color: validBg,
                            textColor: validText,
                            pattern: patNorm,
                            core: CORE_COUNTER_CODES.includes(codeUpper)
                        };
                    });
                }

                const rawEmps = Array.isArray(pubObj.employees)
                    ? pubObj.employees
                    : (pubObj.employees ? Object.values(pubObj.employees) : []);

                const employees = rawEmps
                    .filter(emp => emp && typeof emp === "object")
                    .map((emp, idx) => ({
                        id: Number(emp.id) || (idx + 1),
                        name: (emp.name && String(emp.name).trim()) ? String(emp.name).trim() : ("Employee " + (idx + 1))
                    }));

                const monthRec = (pubObj.months && pubObj.months[monthKey]) ? pubObj.months[monthKey] : null;
                if (!monthRec) {
                    return { employees, assignments: {}, counterRows: [], version: "Not Published", codes: codesList };
                }

                const cleanAssign = {};
                if (monthRec.assignments && typeof monthRec.assignments === "object") {
                    Object.keys(monthRec.assignments).forEach(empId => {
                        const empRow = monthRec.assignments[empId];
                        if (!empRow || typeof empRow !== "object") return;
                        cleanAssign[String(empId)] = {};
                        Object.keys(empRow).forEach(dKey => {
                            if (empRow[dKey]) {
                                cleanAssign[String(empId)][String(dKey)] = String(empRow[dKey]).trim().toUpperCase();
                            }
                        });
                    });
                }

                const extraCounters = Array.isArray(monthRec.counterRows)
                    ? monthRec.counterRows.map(c => String(c).trim().toUpperCase())
                    : [];

                return {
                    employees,
                    assignments: cleanAssign,
                    counterRows: extraCounters,
                    version: monthRec.version ? String(monthRec.version) : "V1",
                    codes: codesList
                };
            }

            function mergeCodeDefinitions(hqCodes, emsCodes) {
                const map = new Map();
                hqCodes.forEach(c => map.set(c.code, c));
                emsCodes.forEach(c => {
                    if (!map.has(c.code)) map.set(c.code, c);
                });
                return Array.from(map.values());
            }

            function renderAll() {
                syncDateNavigatorInputs();

                const hqData = extractDepartmentData(state.hqPublished, state.currentMonthKey);
                const emsData = extractDepartmentData(state.emsPublished, state.currentMonthKey);
                const mergedCodes = mergeCodeDefinitions(hqData.codes, emsData.codes);

                const getCodeDef = (codeStr) => mergedCodes.find(c => c.code === codeStr) || {
                    code: codeStr,
                    label: codeStr,
                    color: "#e2e8f0",
                    textColor: "#000000",
                    pattern: "solid",
                    core: false
                };

                const userSub = document.getElementById("loggedUserSubtitle");
                if (userSub && currentUsername) {
                    userSub.textContent = `Signed in as: ${currentUsername} • HQ (${hqData.version}) + EMS (${emsData.version})`;
                }

                const container = document.getElementById("unifiedRosterWrapper");
                if (!container) return;

                const empColW = 210;
                const dayColW = 34;
                const divW = 24;
                const rowH = 30;
                const legendCodeW = 42;
                const legendLabelW = 185;
                const BOLD_BORDER = "2.5px solid #000000";

                const daysList = getDaysInMonthKey(state.currentMonthKey);
                const query = state.searchQuery.trim().toLowerCase();

                const showHQ = (state.teamFilter === "all" || state.teamFilter === "hq");
                const showEMS = (state.teamFilter === "all" || state.teamFilter === "ems");

                const visHQ = showHQ
                    ? hqData.employees.filter(e => !query || e.name.toLowerCase().includes(query))
                    : [];
                const visEMS = showEMS
                    ? emsData.employees.filter(e => !query || e.name.toLowerCase().includes(query))
                    : [];

                // حساب العدادات اليومية الموحدة
                const totalPerDay = {};
                const codePerDay = {};
                daysList.forEach(dObj => { totalPerDay[dObj.day] = 0; });
                mergedCodes.forEach(c => {
                    codePerDay[c.code] = {};
                    daysList.forEach(dObj => { codePerDay[c.code][dObj.day] = 0; });
                });

                const countEmployeeShifts = (empList, assignMap) => {
                    empList.forEach(emp => {
                        const empAssign = assignMap[String(emp.id)] || {};
                        daysList.forEach(dObj => {
                            const assigned = empAssign[String(dObj.day)];
                            if (assigned) {
                                if (ACTIVE_SHIFT_CODES.includes(assigned)) {
                                    totalPerDay[dObj.day] = (totalPerDay[dObj.day] || 0) + 1;
                                }
                                if (!codePerDay[assigned]) codePerDay[assigned] = {};
                                codePerDay[assigned][dObj.day] = (codePerDay[assigned][dObj.day] || 0) + 1;
                            }
                        });
                    });
                };

                if (showHQ) countEmployeeShifts(hqData.employees, hqData.assignments);
                if (showEMS) countEmployeeShifts(emsData.employees, emsData.assignments);

                // دمج الصفوف السفلية الثابتة (A, B, C) مع أي صف إضافي مفعّل مثل D
                const activeCounterCodes = Array.from(new Set([
                    ...CORE_COUNTER_CODES,
                    ...(showHQ ? hqData.counterRows : []),
                    ...(showEMS ? emsData.counterRows : [])
                ]));

                const showDividerRow = (showHQ && showEMS);
                const totalTbodyRows = visHQ.length + (showDividerRow ? 1 : 0) + visEMS.length + 1 + activeCounterCodes.length;

                const legendRows = mergedCodes.map(c => ({ type: "code", codeObj: c }));
                while (legendRows.length < totalTbodyRows) {
                    legendRows.push({ type: "bottom-blue" });
                }

                const legendCount = legendRows.filter(r => r.type !== "bottom-blue").length;
                const bottomBlueCount = legendRows.length - legendCount;

                const totalTableWidth = empColW + (daysList.length * dayColW) + divW + legendCodeW + legendLabelW;
                const empStickyStyle = `width: ${empColW}px; min-width: ${empColW}px; max-width: ${empColW}px;`;

                let html = `<table class="roster-grid text-center" style="width: ${totalTableWidth}px; border: ${BOLD_BORDER};">`;

                // THEAD
                html += `<thead>`;
                html += `<tr style="border-bottom: ${BOLD_BORDER};">`;
                html += `
                    <th style="${empStickyStyle} background-color: #a3c9b8; border-right: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};"
                        class="sticky-emp-col py-1.5 px-2.5 text-center text-xs sm:text-sm font-black text-slate-950 tracking-wide">
                        THC / OCC (HQ + EMS)
                    </th>
                `;
                daysList.forEach(dObj => {
                    html += `
                        <th style="width: ${dayColW}px; min-width: ${dayColW}px; background-color: #74b3ce; border-bottom: ${BOLD_BORDER};" class="py-1 text-xs font-black text-slate-950">
                            ${dObj.day}
                        </th>
                    `;
                });
                html += `
                    <th rowspan="2" colspan="3"
                        style="width: ${divW + legendCodeW + legendLabelW}px; background-color: #74b3ce; border-left: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};">
                    </th>
                `;
                html += `</tr>`;

                html += `<tr style="border-bottom: ${BOLD_BORDER};">`;
                html += `
                    <th style="${empStickyStyle} background-color: #ffffff; color: #1d4ed8; border-right: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};"
                        class="sticky-emp-col py-1 px-2.5 text-center text-xs font-black">
                        ${escapeHtml(formatMonthBadge(state.currentMonthKey))} / COMBINED
                    </th>
                `;
                daysList.forEach(dObj => {
                    const bg = dObj.isWeekend ? "#dce6f2" : "#ffffff";
                    html += `
                        <th style="width: ${dayColW}px; min-width: ${dayColW}px; background-color: ${bg}; border-bottom: ${BOLD_BORDER};" class="py-1 text-[11px] font-extrabold text-slate-900">
                            ${dObj.abbr}
                        </th>
                    `;
                });
                html += `</tr>`;
                html += `</thead>`;

                function renderRightSideCells(rowIdx) {
                    let cells = "";

                    if (rowIdx === 0 && legendCount > 0) {
                        cells += `
                            <td rowspan="${legendCount}"
                                style="width: ${divW}px; min-width: ${divW}px; max-width: ${divW}px; background-color: #808080; border-left: ${BOLD_BORDER}; border-right: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};">
                            </td>
                        `;
                    }

                    if (rowIdx === legendCount && bottomBlueCount > 0) {
                        cells += `
                            <td rowspan="${bottomBlueCount}" colspan="3"
                                style="background-color: #74b3ce; border-left: ${BOLD_BORDER}; border-top: ${BOLD_BORDER};">
                            </td>
                        `;
                        return cells;
                    }

                    if (rowIdx > legendCount) {
                        return "";
                    }

                    const item = legendRows[rowIdx];
                    if (!item || !item.codeObj) return cells;

                    const c = item.codeObj;
                    const isLastLegendRow = (rowIdx === legendCount - 1);
                    const bottomBorder = isLastLegendRow ? `border-bottom: ${BOLD_BORDER};` : "";
                    const txtColor = resolveCodeTextColor(c);
                    const patCls = getPatternClass(c.pattern);
                    const crispCls = (patCls === "pattern-stripes" && txtColor.toLowerCase() === "#000000") ? "crisp-striped-text" : "";

                    cells += `
                        <td style="width: ${legendCodeW}px; min-width: ${legendCodeW}px; max-width: ${legendCodeW}px; height: ${rowH}px; background-color: ${escapeHtml(c.color)}; color: ${escapeHtml(txtColor)}; border-left: ${BOLD_BORDER}; ${bottomBorder}"
                            class="px-0.5 text-center shift-letter ${patCls} ${crispCls}">
                            ${escapeHtml(c.code)}
                        </td>
                        <td style="min-width: ${legendLabelW}px; height: ${rowH}px; background-color: #ffffff; white-space: nowrap; ${bottomBorder}"
                            class="px-2.5 text-center text-xs font-extrabold text-slate-950 whitespace-nowrap">
                            ${escapeHtml(c.label)}
                        </td>
                    `;
                    return cells;
                }

                // TBODY
                html += `<tbody>`;
                let globalRowIndex = 0;

                const renderEmpRow = (emp, assignMap, teamTag) => {
                    const empAssign = assignMap[String(emp.id)] || {};
                    html += `<tr>`;
                    html += `
                        <td style="${empStickyStyle} height: ${rowH}px; background-color: #ffffff; border-right: ${BOLD_BORDER};"
                            class="sticky-emp-col px-2.5 text-left text-xs font-extrabold text-slate-900">
                            <div class="flex items-center justify-between gap-1">
                                <span class="truncate">${escapeHtml(emp.name)}</span>
                                <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-slate-100 text-slate-500 shrink-0">${teamTag}</span>
                            </div>
                        </td>
                    `;

                    daysList.forEach(dObj => {
                        const codeStr = empAssign[String(dObj.day)] || "";
                        if (!codeStr) {
                            html += `
                                <td style="width: ${dayColW}px; min-width: ${dayColW}px; height: ${rowH}px; background-color: #ffffff;"
                                    class="p-0" title="${escapeHtml(emp.name)} — Day ${dObj.day}: OFF">
                                </td>
                            `;
                        } else {
                            const def = getCodeDef(codeStr);
                            const txtColor = resolveCodeTextColor(def);
                            const patCls = getPatternClass(def.pattern);
                            const crispCls = (patCls === "pattern-stripes" && txtColor.toLowerCase() === "#000000") ? "crisp-striped-text" : "";

                            html += `
                                <td style="width: ${dayColW}px; min-width: ${dayColW}px; height: ${rowH}px; background-color: ${escapeHtml(def.color)}; color: ${escapeHtml(txtColor)};"
                                    class="p-0 shift-letter ${patCls} ${crispCls}"
                                    title="${escapeHtml(emp.name)} — Day ${dObj.day}: ${escapeHtml(def.code)} (${escapeHtml(def.label)})">
                                    ${escapeHtml(def.code)}
                                </td>
                            `;
                        }
                    });

                    html += renderRightSideCells(globalRowIndex);
                    html += `</tr>`;
                    globalRowIndex++;
                };

                // 1. HQ Team Rows
                visHQ.forEach(emp => renderEmpRow(emp, hqData.assignments, "HQ"));

                // 2. EMS Team Divider Row
                if (showDividerRow) {
                    html += `<tr style="border-top: 2px solid #000000; border-bottom: 2px solid #000000;">`;
                    html += `
                        <td style="${empStickyStyle} height: 24px; background-color: #dbeafe; color: #1e3a8a; border-right: ${BOLD_BORDER}; border-top: 2px solid #000000; border-bottom: 2px solid #000000;"
                            class="sticky-emp-col px-2.5 text-center text-[11px] font-black tracking-wider">
                            --- EMS TEAM ---
                        </td>
                        <td colspan="${daysList.length}" style="height: 24px; background-color: #eff6ff; color: #1e3a8a; border-top: 2px solid #000000; border-bottom: 2px solid #000000;"
                            class="text-center text-[10.5px] font-extrabold tracking-widest">
                            --- EMS TEAM (${escapeHtml(emsData.version)}) ---
                        </td>
                    `;
                    html += renderRightSideCells(globalRowIndex);
                    html += `</tr>`;
                    globalRowIndex++;
                }

                // 3. EMS Team Rows
                visEMS.forEach(emp => renderEmpRow(emp, emsData.assignments, "EMS"));

                // 4. Consolidated Total Active Row (A, B, C, D)
                html += `<tr style="border-top: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};">`;
                html += `
                    <td style="${empStickyStyle} height: ${rowH}px; background-color: #a3c9b8; border-right: ${BOLD_BORDER}; border-top: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};"
                        class="sticky-emp-col px-2.5 text-center text-xs font-black text-slate-950">
                        Total Active
                    </td>
                `;
                daysList.forEach(dObj => {
                    const count = totalPerDay[dObj.day] || 0;
                    html += `
                        <td style="width: ${dayColW}px; min-width: ${dayColW}px; height: ${rowH}px; background-color: #fecdd3; color: #991b1b; border-top: ${BOLD_BORDER}; border-bottom: ${BOLD_BORDER};"
                            class="text-xs font-black">
                            ${count}
                        </td>
                    `;
                });
                html += renderRightSideCells(globalRowIndex);
                html += `</tr>`;
                globalRowIndex++;

                // 5. Consolidated Counter Rows (A, B, C + any enabled rows like D)
                activeCounterCodes.forEach(codeStr => {
                    const def = getCodeDef(codeStr);
                    const isCore = CORE_COUNTER_CODES.includes(codeStr);
                    const txtColor = resolveCodeTextColor(def);
                    const patCls = getPatternClass(def.pattern);
                    const crispCls = (patCls === "pattern-stripes" && txtColor.toLowerCase() === "#000000") ? "crisp-striped-text" : "";
                    const countsMap = codePerDay[codeStr] || {};

                    html += `<tr>`;
                    html += `
                        <td style="${empStickyStyle} height: ${rowH}px; background-color: ${escapeHtml(def.color)}; color: ${escapeHtml(txtColor)}; border-right: ${BOLD_BORDER};"
                            class="sticky-emp-col px-2.5 text-center ${patCls} ${crispCls}">
                            <span class="shift-letter">${escapeHtml(def.code)}</span>
                            <span class="text-[11px] font-bold opacity-85">(${escapeHtml(def.label)})</span>
                        </td>
                    `;
                    daysList.forEach(dObj => {
                        const val = countsMap[dObj.day] || 0;
                        const isZeroAlert = isCore && (val === 0);
                        const cellBg = isZeroAlert ? "#dc2626" : "#ffffff";
                        const cellText = isZeroAlert ? "#ffffff" : "#0f172a";
                        const cellFont = isZeroAlert ? "text-sm font-black" : "text-xs font-extrabold";

                        html += `
                            <td style="width: ${dayColW}px; min-width: ${dayColW}px; height: ${rowH}px; background-color: ${cellBg}; color: ${cellText};"
                                class="${cellFont}">
                                ${val}
                            </td>
                        `;
                    });
                    html += renderRightSideCells(globalRowIndex);
                    html += `</tr>`;
                    globalRowIndex++;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }

            function handlePrintPDF() {
                const wrapper = document.getElementById("unifiedRosterWrapper");
                if (wrapper) {
                    const tableEl = wrapper.querySelector("table");
                    const tableWidth = tableEl ? tableEl.offsetWidth : 1480;
                    const printableLandscapePx = 1040;
                    const scale = Math.min(1, Math.max(0.45, Number((printableLandscapePx / tableWidth).toFixed(3))));
                    document.documentElement.style.setProperty("--print-scale", String(scale));
                }
                window.print();
            }

            function exportCombinedCSV() {
                const hqData = extractDepartmentData(state.hqPublished, state.currentMonthKey);
                const emsData = extractDepartmentData(state.emsPublished, state.currentMonthKey);
                const daysList = getDaysInMonthKey(state.currentMonthKey);

                let csv = `\uFEFF"Team","Staff (${formatMonthBadge(state.currentMonthKey)})",` + daysList.map(d => d.day).join(",") + "\n";
                csv += `"","Day",` + daysList.map(d => d.abbr).join(",") + "\n";

                hqData.employees.forEach(emp => {
                    const empAssign = hqData.assignments[String(emp.id)] || {};
                    const rowCells = daysList.map(d => `"${empAssign[String(d.day)] || ""}"`);
                    csv += `"HQ","${emp.name.replace(/"/g, '""')}",${rowCells.join(",")}\n`;
                });

                emsData.employees.forEach(emp => {
                    const empAssign = emsData.assignments[String(emp.id)] || {};
                    const rowCells = daysList.map(d => `"${empAssign[String(d.day)] || ""}"`);
                    csv += `"EMS","${emp.name.replace(/"/g, '""')}",${rowCells.join(",")}\n`;
                });

                const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `THC_OCC_Combined_Roster_${state.currentMonthKey}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // Event Bindings
            document.getElementById("monthPartSelect").addEventListener("change", function (e) {
                const yearSel = document.getElementById("yearPartSelect");
                const yStr = yearSel ? yearSel.value : "2026";
                if (e.target.value) {
                    state.currentMonthKey = normalizeRosterMonthKey(yStr + "-" + e.target.value);
                    renderAll();
                }
            });

            document.getElementById("yearPartSelect").addEventListener("change", function (e) {
                const yStr = e.target.value;
                const monthSel = document.getElementById("monthPartSelect");
                const prevMonthVal = monthSel ? monthSel.value : "12";
                if (yStr) {
                    const targetMonth = yStr === "2026" ? "12" : prevMonthVal;
                    state.currentMonthKey = normalizeRosterMonthKey(yStr + "-" + targetMonth);
                    renderAll();
                }
            });

            document.getElementById("teamFilterSelect").addEventListener("change", function (e) {
                state.teamFilter = e.target.value;
                renderAll();
            });

            document.getElementById("empSearchInput").addEventListener("input", function (e) {
                state.searchQuery = e.target.value;
                renderAll();
            });

            document.body.addEventListener("click", function (e) {
                const actionEl = e.target.closest("[data-action]");
                if (!actionEl) return;
                const action = actionEl.dataset.action;

                if (action === "sign-out" && authInstance) {
                    authInstance.signOut();
                } else if (action === "prev-month") {
                    if (state.currentMonthKey === "2026-12") return;
                    const { year, monthIndex } = parseMonthKey(state.currentMonthKey);
                    const prevDate = new Date(year, monthIndex - 1, 1);
                    const candidateKey = prevDate.getFullYear() + "-" + String(prevDate.getMonth() + 1).padStart(2, "0");
                    if (candidateKey >= "2026-12") {
                        state.currentMonthKey = normalizeRosterMonthKey(candidateKey);
                        renderAll();
                    }
                } else if (action === "next-month") {
                    if (state.currentMonthKey === "2030-12") return;
                    const { year, monthIndex } = parseMonthKey(state.currentMonthKey);
                    const nextDate = new Date(year, monthIndex + 1, 1);
                    const candidateKey = nextDate.getFullYear() + "-" + String(nextDate.getMonth() + 1).padStart(2, "0");
                    if (candidateKey <= "2030-12") {
                        state.currentMonthKey = normalizeRosterMonthKey(candidateKey);
                        renderAll();
                    }
                } else if (action === "print-roster") {
                    handlePrintPDF();
                } else if (action === "export-csv") {
                    exportCombinedCSV();
                }
            });

            document.getElementById("firebaseLoginForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const rawUser = document.getElementById("gateUsernameInput").value.trim().toLowerCase();
                const pass = document.getElementById("gatePasswordInput").value;
                const errEl = document.getElementById("gateLoginError");
                errEl.classList.add("hidden");

                if (!rawUser || !pass || !authInstance) return;
                const email = rawUser.includes("@") ? rawUser : (rawUser + AUTH_DOMAIN_SUFFIX);

                authInstance.signInWithEmailAndPassword(email, pass).catch(function () {
                    errEl.textContent = "Invalid username or password (or verify apiKey).";
                    errEl.classList.remove("hidden");
                });
            });

            function bootCombinedApp() {
                const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                authInstance = firebase.auth(app);
                dbInstance = firebase.database(app);

                dbInstance.ref(".info/connected").on("value", function (snap) {
                    updateStatusBadge(snap.val() ? "connected" : "offline");
                });

                authInstance.onAuthStateChanged(function (user) {
                    if (!user) {
                        currentUsername = "";
                        document.getElementById("loginGateOverlay").classList.remove("hidden");
                        document.getElementById("protectedAppShell").classList.add("hidden");
                        return;
                    }

                    currentUsername = (user.email || "").split("@")[0].toLowerCase();
                    document.getElementById("loginGateOverlay").classList.add("hidden");
                    document.getElementById("protectedAppShell").classList.remove("hidden");

                    dbInstance.ref(HQ_DB_PATH + "/published").on("value", function (snap) {
                        state.hqPublished = snap.val();
                        renderAll();
                    });

                    dbInstance.ref(EMS_DB_PATH + "/published").on("value", function (snap) {
                        state.emsPublished = snap.val();
                        renderAll();
                    });

                    renderAll();
                });
            }

            state.currentMonthKey = normalizeRosterMonthKey(state.currentMonthKey);
            populateMonthSelectDropdown("2026");
            bootCombinedApp();
        })();
    </script>
</body>
</html>
