<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THC / OCC HQ - Monthly Shift Roster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
    }

    /* Main Roster Layout Container */
    .roster-wrapper {
      display: inline-flex;
      align-items: stretch;
      background: #ffffff;
      border: 2.5px solid #000000;
    }

    table.roster-table {
      border-collapse: collapse;
      background: #ffffff;
      font-size: 11px;
      line-height: 1.15;
    }

    table.roster-table th,
    table.roster-table td {
      border: 1px solid #000000;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      user-select: none;
    }

    /* Header & Columns */
    .thc-title-cell {
      background-color: #b4d5c0;
      font-weight: 800;
      font-size: 14px;
      color: #000000;
      min-width: 175px;
      width: 175px;
      height: 28px;
      border-right: 2.5px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
    }

    .month-ver-cell {
      background-color: #ffffff;
      font-weight: 800;
      font-size: 12px;
      color: #1d4ed8;
      height: 24px;
      border-right: 2.5px solid #000000 !important;
      border-bottom: 2.5px solid #000000 !important;
    }

    .day-num-cell {
      background-color: #7ab3d1;
      font-weight: 800;
      font-size: 11px;
      color: #000000;
      width: 28px;
      min-width: 28px;
      height: 28px;
      border-bottom: 1.5px solid #000000 !important;
    }

    .day-name-cell {
      background-color: #ffffff;
      font-weight: 700;
      font-size: 10px;
      color: #000000;
      width: 28px;
      min-width: 28px;
      height: 24px;
      border-bottom: 2.5px solid #000000 !important;
    }

    .wknd-hdr {
      background-color: #e2e8f0 !important;
    }

    .staff-name-cell {
      text-align: left !important;
      padding: 0 6px !important;
      font-weight: 700;
      font-size: 11.5px;
      color: #000000;
      height: 26px;
      white-space: nowrap;
      border-right: 2.5px solid #000000 !important;
      background-color: #ffffff;
    }

    .shift-cell {
      width: 28px;
      min-width: 28px;
      height: 26px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      transition: filter 0.1s;
    }
    .shift-cell:hover { filter: brightness(0.92); }
    .shift-cell.selected-cell {
      outline: 2px solid #2563eb;
      outline-offset: -2px;
      z-index: 5;
    }

    /* Summary Rows */
    .total-active-label {
      background-color: #9ec5ab;
      font-weight: 800;
      font-size: 11.5px;
      color: #000000;
      height: 26px;
      border-top: 2.5px solid #000000 !important;
      border-right: 2.5px solid #000000 !important;
    }
    .total-active-val {
      background-color: #f3c6c6;
      font-weight: 800;
      font-size: 11px;
      color: #991b1b;
      height: 26px;
      border-top: 2.5px solid #000000 !important;
    }

    .count-row-label {
      font-weight: 800;
      font-size: 11px;
      color: #000000;
      height: 25px;
      border-right: 2.5px solid #000000 !important;
    }
    .count-row-val {
      background-color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      color: #000000;
      height: 25px;
    }

    /* Right Side Divider & Legend Panel */
    .side-divider {
      width: 12px;
      min-width: 12px;
      background-color: #808080;
      border-left: 2.5px solid #000000;
      border-right: 2.5px solid #000000;
    }

    .legend-panel {
      display: flex;
      flex-direction: column;
      width: 185px;
      min-width: 185px;
      background-color: #ffffff;
    }

    .legend-top-blue {
      height: 52px;
      min-height: 52px;
      background-color: #7ab3d1;
      border-bottom: 2.5px solid #000000;
    }

    .legend-items-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .legend-row {
      display: flex;
      flex: 1;
      min-height: 23px;
      border-bottom: 1px solid #000000;
    }
    .legend-row:last-child {
      border-bottom: none;
    }

    .legend-code {
      width: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      color: #000000;
      border-right: 1px solid #000000;
    }

    .legend-desc {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 10.5px;
      color: #000000;
      padding: 0 4px;
      text-align: center;
    }

    .legend-bottom-blue {
      height: 76px;
      min-height: 76px;
      background-color: #7ab3d1;
      border-top: 2.5px solid #000000;
    }

    /* Shift Code Colors & Patterns */
    .code-A  { background-color: #fef08a; color: #000000; }
    .code-B  { background-color: #bae6fd; color: #000000; }
    .code-C  { background-color: #9ca3af; color: #000000; }
    .code-D  { background-color: #fed7aa; color: #000000; }
    .code-O  { background-color: #6082b6; color: #000000; }
    .code-S  {
      background: repeating-linear-gradient(90deg, #ef4444, #ef4444 3px, #fecaca 3px, #fecaca 6px);
      color: #000000;
    }
    .code-V  { background-color: #f5d0fe; color: #000000; }
    .code-T  { background-color: #1e3a8a; color: #ffffff; }
    .code-MT { background-color: #ea580c; color: #000000; }
    .code-E  {
      background-color: #7f1d1d;
      background-image: linear-gradient(rgba(255,255,255,0.25) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 4px 4px;
      color: #ffffff;
    }
    .code-SW { background-color: #3b6ea5; color: #ffffff; }
    .code-CD { background-color: #374151; color: #ffffff; }

    /* Print / PDF Rules */
    @page {
      size: A4 landscape;
      margin: 6mm;
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print { display: none !important; }
      #mainApp { padding: 0 !important; max-width: 100% !important; }
      #printArea {
        overflow: visible !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        display: flex !important;
        justify-content: center !important;
      }
      .roster-wrapper {
        border: 2.5px solid #000000 !important;
        zoom: 0.78;
      }
      table.roster-table {
        border-collapse: separate !important;
        border-spacing: 0 !important;
      }
      table.roster-table th,
      table.roster-table td {
        border: none !important;
        border-right: 1px solid #000000 !important;
        border-bottom: 1px solid #000000 !important;
      }
      table.roster-table tr:last-child td {
        border-bottom: none !important;
      }
      .thc-title-cell, .month-ver-cell, .staff-name-cell, .total-active-label, .count-row-label {
        border-right: 2.5px solid #000000 !important;
      }
      .month-ver-cell, .day-name-cell {
        border-bottom: 2.5px solid #000000 !important;
      }
      .total-active-label, .total-active-val {
        border-top: 2.5px solid #000000 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 border border-slate-200">
      <div class="text-center mb-5">
        <div class="inline-block bg-emerald-100 text-emerald-800 font-extrabold px-3 py-1 rounded-full text-xs mb-2">OCC / THC HQ</div>
        <h2 class="text-xl font-bold text-slate-800">Monthly Shift Roster</h2>
        <p class="text-xs text-slate-500 mt-1">Sign in with your authorized @occ.local username</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
          <input type="text" id="loginUser" required placeholder="e.g. fawari" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-600" />
        </div>
        <div id="loginError" class="text-xs text-red-600 font-semibold hidden"></div>
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-lg text-sm transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden p-3 max-w-[1600px] mx-auto">

    <!-- Top Control Bar -->
    <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <span id="syncStatus" class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">Connecting...</span>
        <span id="roleBadge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700">Role</span>
        <span id="modeBadge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800">Draft Mode</span>

        <div class="h-5 w-px bg-slate-300 mx-1"></div>

        <select id="monthSelect" class="border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold bg-white"></select>
        <select id="yearSelect" class="border border-slate-300 rounded-lg px-2 py-1 text-xs font-bold bg-white"></select>

        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-lg border border-slate-200">
          <span class="text-xs font-bold text-slate-600">Ver:</span>
          <input type="text" id="versionInput" value="V1" class="w-12 text-xs font-bold text-center border border-slate-300 rounded px-1 py-0.5 bg-white" />
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <button id="btnAddStaff" class="sup-only hidden bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg">+ Staff</button>
        <button id="btnUndo" class="sup-only hidden bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-lg" title="Undo">↩ Undo</button>
        <button id="btnRedo" class="sup-only hidden bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-2.5 py-1.5 rounded-lg" title="Redo">↪ Redo</button>
        <button id="btnSyncLeaves" class="sup-only hidden bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">⇄ Sync Leaves</button>
        <button id="btnPublish" class="sup-only hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm">📢 Publish & Approve</button>
        <button id="btnReceipts" class="sup-only hidden bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">👁 Receipts</button>
        <button id="btnAudit" class="sup-only hidden bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">📜 Audit</button>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">🖨 Print / PDF</button>
        <button id="btnExportCSV" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">📥 CSV</button>
        <button id="btnChangePass" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-300">🔑 Password</button>
        <button id="btnLogout" class="bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-red-200">Sign Out</button>
      </div>
    </div>

    <!-- Quick Shift Brush Bar (Supervisors Only) -->
    <div id="brushBar" class="no-print sup-only hidden bg-white rounded-xl shadow-sm border border-slate-200 p-2 mb-3 flex flex-wrap items-center gap-1.5">
      <span class="text-xs font-bold text-slate-600 mr-1">Quick Paint:</span>
      <button data-code="" class="brush-btn px-2.5 py-1 rounded text-xs font-bold border border-slate-300 bg-white">Eraser (Clear)</button>
      <button data-code="A" class="brush-btn code-A px-2.5 py-1 rounded text-xs font-bold border border-black">A</button>
      <button data-code="B" class="brush-btn code-B px-2.5 py-1 rounded text-xs font-bold border border-black">B</button>
      <button data-code="C" class="brush-btn code-C px-2.5 py-1 rounded text-xs font-bold border border-black">C</button>
      <button data-code="D" class="brush-btn code-D px-2.5 py-1 rounded text-xs font-bold border border-black">D</button>
      <button data-code="O" class="brush-btn code-O px-2.5 py-1 rounded text-xs font-bold border border-black">O</button>
      <button data-code="S" class="brush-btn code-S px-2.5 py-1 rounded text-xs font-bold border border-black">S</button>
      <button data-code="V" class="brush-btn code-V px-2.5 py-1 rounded text-xs font-bold border border-black">V</button>
      <button data-code="T" class="brush-btn code-T px-2.5 py-1 rounded text-xs font-bold border border-black">T</button>
      <button data-code="MT" class="brush-btn code-MT px-2.5 py-1 rounded text-xs font-bold border border-black">MT</button>
      <button data-code="E" class="brush-btn code-E px-2.5 py-1 rounded text-xs font-bold border border-black">E</button>
      <button data-code="SW" class="brush-btn code-SW px-2.5 py-1 rounded text-xs font-bold border border-black">SW</button>
      <button data-code="CD" class="brush-btn code-CD px-2.5 py-1 rounded text-xs font-bold border border-black">CD</button>
      <span class="text-[11px] text-slate-400 ml-auto">Tip: Click a brush then click/drag cells, or click cell & type code.</span>
    </div>

    <!-- Roster Table Container -->
    <div id="printArea" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 overflow-x-auto">
      <div class="roster-wrapper" id="rosterWrapper">
        <!-- Left Main Roster Table -->
        <table class="roster-table" id="rosterTable">
          <thead id="rosterHead"></thead>
          <tbody id="rosterBody"></tbody>
        </table>

        <!-- Vertical Grey Divider -->
        <div class="side-divider"></div>

        <!-- Right Legend Panel -->
        <div class="legend-panel">
          <div class="legend-top-blue"></div>
          <div class="legend-items-container" id="legendContainer"></div>
          <div class="legend-bottom-blue"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Staff Modal -->
  <div id="staffModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-5">
      <h3 id="staffModalTitle" class="text-base font-bold text-slate-800 mb-3">Add Staff Member</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
          <input type="text" id="staffNameInput" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm" placeholder="e.g. Fahad Awari" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Login Username (without @occ.local)</label>
          <input type="text" id="staffUserInput" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm" placeholder="e.g. fawari" />
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button id="btnDeleteStaff" class="hidden mr-auto bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold px-3 py-1.5 rounded-lg">Delete</button>
        <button id="btnCancelStaff" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg">Cancel</button>
        <button id="btnSaveStaff" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-1.5 rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <!-- Info Modal (Receipts / Audit) -->
  <div id="infoModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h3 id="infoModalTitle" class="text-base font-bold text-slate-800">Details</h3>
        <button onclick="document.getElementById('infoModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <div id="infoModalBody" class="overflow-y-auto text-xs space-y-2 flex-1"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://leave-2027-default-rtdb.firebaseio.com",
      apiKey: "AIzaSyA731dlhUgqoMGG7J_GUBn_H7vxvEPchms",
      authDomain: "leave-2027.firebaseapp.com",
      projectId: "leave-2027"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const DB_ROOT = "monthly_roster_occ_thc";
    const LEAVE_DB_ROOT = "leave_planner_2027";
    const ROSTER_TITLE = "THC / OCC HQ";
    const ADMIN_SUPERVISORS = ["fawari", "aalharb", "malreheili", "aalshalawi", "abasaeed", "asofta"];

    const LEGEND_ITEMS = [
      { code: "A",  desc: "07:00-15:00" },
      { code: "B",  desc: "15:00-23:00" },
      { code: "C",  desc: "23:00-07:00" },
      { code: "D",  desc: "11:00-16:00" },
      { code: "O",  desc: "Office duty" },
      { code: "S",  desc: "Sick" },
      { code: "V",  desc: "Vacation" },
      { code: "T",  desc: "Training / Test" },
      { code: "MT", desc: "Meeting / Task" },
      { code: "E",  desc: "Family reason" },
      { code: "SW", desc: "Shift Swap" },
      { code: "CD", desc: "Compensation Day" }
    ];

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const DAY_NAMES = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

    let currentUser = null;
    let currentUsername = "";
    let isSupervisor = false;
    let selectedMonth = new Date().getMonth();
    let selectedYear = new Date().getFullYear();
    let rosterData = { version: "V1", staff: [], assignments: {} };
    let activeBrush = null;
    let isMouseDown = false;
    let undoStack = [];
    let redoStack = [];
    let editingStaffIndex = null;

    // Render Legend
    const legendContainer = document.getElementById("legendContainer");
    LEGEND_ITEMS.forEach(item => {
      const row = document.createElement("div");
      row.className = "legend-row";
      row.innerHTML = `
        <div class="legend-code code-${item.code}">${item.code}</div>
        <div class="legend-desc">${item.desc}</div>
      `;
      legendContainer.appendChild(row);
    });

    // Populate Month & Year Selectors
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");
    MONTHS.forEach((m, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = m;
      if (idx === selectedMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    });
    for (let y = 2025; y <= 2030; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      if (y === selectedYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }

    monthSelect.addEventListener("change", () => { selectedMonth = parseInt(monthSelect.value); loadMonthData(); });
    yearSelect.addEventListener("change", () => { selectedYear = parseInt(yearSelect.value); loadMonthData(); });

    // Auth Handling
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const rawUser = document.getElementById("loginUser").value.trim().toLowerCase();
      const email = rawUser.includes("@") ? rawUser : `${rawUser}@occ.local`;
      const pass = document.getElementById("loginPass").value;
      const errEl = document.getElementById("loginError");
      errEl.classList.add("hidden");
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        errEl.textContent = "Invalid username or password.";
        errEl.classList.remove("hidden");
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => auth.signOut());

    document.getElementById("btnChangePass").addEventListener("click", async () => {
      const newPass = prompt("Enter new password (minimum 6 characters):");
      if (!newPass || newPass.length < 6) return alert("Password must be at least 6 characters.");
      try {
        await currentUser.updatePassword(newPass);
        alert("Password updated successfully!");
      } catch (e) {
        alert("Please sign out and sign in again before changing password.");
      }
    });

    auth.onAuthStateChanged(user => {
      if (!user) {
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.add("hidden");
        return;
      }
      currentUser = user;
      currentUsername = user.email.split("@")[0].toLowerCase();
      isSupervisor = ADMIN_SUPERVISORS.includes(currentUsername);

      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("roleBadge").textContent = isSupervisor ? `Supervisor (${currentUsername})` : `Staff (${currentUsername})`;
      document.getElementById("modeBadge").textContent = isSupervisor ? "Draft Mode" : "Published Official Version";

      document.querySelectorAll(".sup-only").forEach(el => {
        if (isSupervisor) el.classList.remove("hidden");
        else el.classList.add("hidden");
      });

      db.ref(".info/connected").on("value", snap => {
        const el = document.getElementById("syncStatus");
        if (snap.val() === true) {
          el.textContent = "Live Cloud Sync";
          el.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
        } else {
          el.textContent = "Offline";
          el.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-red-100 text-red-800";
        }
      });

      loadMonthData();
    });

    function getMonthKey() {
      return `${selectedYear}-${String(selectedMonth + 1).padStart(2, "0")}`;
    }

    function loadMonthData() {
      const key = getMonthKey();
      const path = isSupervisor ? `${DB_ROOT}/draft/${key}` : `${DB_ROOT}/published/${key}`;
      db.ref(path).off();
      db.ref(path).on("value", snap => {
        const val = snap.val();
        if (val) {
          rosterData = {
            version: val.version || "V1",
            staff: val.staff || [],
            assignments: val.assignments || {}
          };
        } else {
          rosterData = { version: "V1", staff: [], assignments: {} };
        }
        document.getElementById("versionInput").value = rosterData.version;
        renderRoster();

        if (!isSupervisor && val) {
          db.ref(`${DB_ROOT}/read_receipts/${key}/${currentUsername}`).set({
            username: currentUsername,
            version: rosterData.version,
            timestamp: new Date().toISOString()
          });
        }
      });
    }

    function saveDraft(pushUndo = true) {
      if (!isSupervisor) return;
      if (pushUndo) {
        undoStack.push(JSON.stringify(rosterData));
        if (undoStack.length > 30) undoStack.shift();
        redoStack = [];
      }
      const key = getMonthKey();
      db.ref(`${DB_ROOT}/draft/${key}`).set(rosterData);
    }

    document.getElementById("versionInput").addEventListener("change", (e) => {
      if (!isSupervisor) return;
      rosterData.version = e.target.value.trim() || "V1";
      saveDraft();
      renderRoster();
    });

    // Brush Selection
    document.querySelectorAll(".brush-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".brush-btn").forEach(b => b.classList.remove("ring-2", "ring-blue-600"));
        if (activeBrush === btn.dataset.code) {
          activeBrush = null;
        } else {
          activeBrush = btn.dataset.code;
          btn.classList.add("ring-2", "ring-blue-600");
        }
      });
    });

    document.addEventListener("mouseup", () => { isMouseDown = false; });

    function getDaysInMonth(year, month) {
      const total = new Date(year, month + 1, 0).getDate();
      const days = [];
      for (let d = 1; d <= total; d++) {
        const dt = new Date(year, month, d);
        const dayIdx = dt.getDay();
        days.push({
          day: d,
          name: DAY_NAMES[dayIdx],
          isWeekend: (dayIdx === 5 || dayIdx === 6)
        });
      }
      return days;
    }

    function renderRoster() {
      const days = getDaysInMonth(selectedYear, selectedMonth);
      const thead = document.getElementById("rosterHead");
      const tbody = document.getElementById("rosterBody");

      const monthLabel = `${MONTHS[selectedMonth]}-${String(selectedYear).slice(-2)} / ${rosterData.version}`;

      // Header Row 1: Title + Day Numbers
      let h1 = `<tr><th class="thc-title-cell">${ROSTER_TITLE}</th>`;
      days.forEach(d => {
        h1 += `<th class="day-num-cell">${d.day}</th>`;
      });
      h1 += `</tr>`;

      // Header Row 2: Month/Version + Day Names
      let h2 = `<tr><th class="month-ver-cell">${monthLabel}</th>`;
      days.forEach(d => {
        h2 += `<th class="day-name-cell ${d.isWeekend ? 'wknd-hdr' : ''}">${d.name}</th>`;
      });
      h2 += `</tr>`;
      thead.innerHTML = h1 + h2;

      // Body: Staff Rows
      let bodyHTML = "";
      const activeTotals = {};
      const shiftCounts = { A: {}, B: {}, C: {} };

      days.forEach(d => {
        activeTotals[d.day] = 0;
        shiftCounts.A[d.day] = 0;
        shiftCounts.B[d.day] = 0;
        shiftCounts.C[d.day] = 0;
      });

      rosterData.staff.forEach((person, idx) => {
        const pAssign = rosterData.assignments[person.id] || {};
        bodyHTML += `<tr>`;
        bodyHTML += `<td class="staff-name-cell">
          <div class="flex items-center justify-between">
            <span>${person.name}</span>
            ${isSupervisor ? `<button onclick="openEditStaff(${idx})" class="no-print text-slate-400 hover:text-blue-600 ml-2 text-[10px]" title="Edit">✎</button>` : ""}
          </div>
        </td>`;

        days.forEach(d => {
          const code = pAssign[d.day] || "";
          if (["A", "B", "C", "D"].includes(code)) {
            activeTotals[d.day]++;
          }
          if (code === "A") shiftCounts.A[d.day]++;
          if (code === "B") shiftCounts.B[d.day]++;
          if (code === "C") shiftCounts.C[d.day]++;

          bodyHTML += `<td class="shift-cell ${code ? 'code-' + code : ''}"
            data-staff="${person.id}" data-day="${d.day}"
            onmousedown="handleCellDown('${person.id}', ${d.day})"
            onmouseenter="handleCellEnter('${person.id}', ${d.day})">${code}</td>`;
        });
        bodyHTML += `</tr>`;
      });

      // Summary Row: Total Active (A, B, C, D only)
      bodyHTML += `<tr><td class="total-active-label">Total Active</td>`;
      days.forEach(d => {
        bodyHTML += `<td class="total-active-val">${activeTotals[d.day]}</td>`;
      });
      bodyHTML += `</tr>`;

      // Summary Rows: A, B, C Counts
      const summaryMeta = [
        { code: "A", label: `A <span class="font-normal text-[9.5px]">(07:00-15:00)</span>`, cls: "code-A" },
        { code: "B", label: `B <span class="font-normal text-[9.5px]">(15:00-23:00)</span>`, cls: "code-B" },
        { code: "C", label: `C <span class="font-normal text-[9.5px]">(23:00-07:00)</span>`, cls: "code-C" }
      ];

      summaryMeta.forEach(sm => {
        bodyHTML += `<tr><td class="count-row-label ${sm.cls}">${sm.label}</td>`;
        days.forEach(d => {
          bodyHTML += `<td class="count-row-val">${shiftCounts[sm.code][d.day]}</td>`;
        });
        bodyHTML += `</tr>`;
      });

      tbody.innerHTML = bodyHTML;
    }

    function applyShift(staffId, day, code) {
      if (!isSupervisor) return;
      if (!rosterData.assignments[staffId]) rosterData.assignments[staffId] = {};
      if (code === "") {
        delete rosterData.assignments[staffId][day];
      } else {
        rosterData.assignments[staffId][day] = code;
      }
      renderRoster();
    }

    window.handleCellDown = function(staffId, day) {
      if (!isSupervisor) return;
      isMouseDown = true;
      if (activeBrush !== null) {
        saveDraft();
        applyShift(staffId, day, activeBrush);
      } else {
        const codes = ["", "A", "B", "C", "D", "O", "S", "V", "T", "MT", "E", "SW", "CD"];
        const curr = (rosterData.assignments[staffId] && rosterData.assignments[staffId][day]) || "";
        const next = codes[(codes.indexOf(curr) + 1) % codes.length];
        saveDraft();
        applyShift(staffId, day, next);
      }
    };

    window.handleCellEnter = function(staffId, day) {
      if (!isSupervisor || !isMouseDown || activeBrush === null) return;
      applyShift(staffId, day, activeBrush);
    };

    // Staff CRUD
    document.getElementById("btnAddStaff").addEventListener("click", () => {
      editingStaffIndex = null;
      document.getElementById("staffModalTitle").textContent = "Add Staff Member";
      document.getElementById("staffNameInput").value = "";
      document.getElementById("staffUserInput").value = "";
      document.getElementById("btnDeleteStaff").classList.add("hidden");
      document.getElementById("staffModal").classList.remove("hidden");
      document.getElementById("staffModal").classList.add("flex");
    });

    window.openEditStaff = function(idx) {
      editingStaffIndex = idx;
      const p = rosterData.staff[idx];
      document.getElementById("staffModalTitle").textContent = "Edit Staff Member";
      document.getElementById("staffNameInput").value = p.name;
      document.getElementById("staffUserInput").value = p.username || "";
      document.getElementById("btnDeleteStaff").classList.remove("hidden");
      document.getElementById("staffModal").classList.remove("hidden");
      document.getElementById("staffModal").classList.add("flex");
    };

    document.getElementById("btnCancelStaff").addEventListener("click", () => {
      document.getElementById("staffModal").classList.add("hidden");
    });

    document.getElementById("btnSaveStaff").addEventListener("click", () => {
      const name = document.getElementById("staffNameInput").value.trim();
      const username = document.getElementById("staffUserInput").value.trim().toLowerCase();
      if (!name) return;
      if (editingStaffIndex === null) {
        rosterData.staff.push({ id: "s_" + Date.now(), name, username });
      } else {
        rosterData.staff[editingStaffIndex].name = name;
        rosterData.staff[editingStaffIndex].username = username;
      }
      saveDraft();
      renderRoster();
      document.getElementById("staffModal").classList.add("hidden");
    });

    document.getElementById("btnDeleteStaff").addEventListener("click", () => {
      if (editingStaffIndex === null) return;
      if (!confirm("Delete this staff member from this roster?")) return;
      const id = rosterData.staff[editingStaffIndex].id;
      rosterData.staff.splice(editingStaffIndex, 1);
      delete rosterData.assignments[id];
      saveDraft();
      renderRoster();
      document.getElementById("staffModal").classList.add("hidden");
    });

    // Undo / Redo
    document.getElementById("btnUndo").addEventListener("click", () => {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(rosterData));
      rosterData = JSON.parse(undoStack.pop());
      saveDraft(false);
      renderRoster();
    });

    document.getElementById("btnRedo").addEventListener("click", () => {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(rosterData));
      rosterData = JSON.parse(redoStack.pop());
      saveDraft(false);
      renderRoster();
    });

    // Publish & Approve
    document.getElementById("btnPublish").addEventListener("click", async () => {
      if (!isSupervisor) return;
      if (!confirm(`Publish & Approve ${ROSTER_TITLE} (${MONTHS[selectedMonth]} ${selectedYear} - ${rosterData.version}) to all staff?`)) return;
      const key = getMonthKey();
      await db.ref(`${DB_ROOT}/published/${key}`).set(rosterData);
      await db.ref(`${DB_ROOT}/audit_log/${key}`).push({
        by: currentUsername,
        action: `Published version ${rosterData.version}`,
        timestamp: new Date().toISOString()
      });
      alert("Published successfully! Staff can now view this official version.");
    });

    // Sync Leaves from Annual Planner
    document.getElementById("btnSyncLeaves").addEventListener("click", async () => {
      if (!isSupervisor) return;
      const snap = await db.ref(`${LEAVE_DB_ROOT}`).once("value");
      const leaveData = snap.val();
      if (!leaveData) return alert("No annual leave data found.");
      alert("Annual leave sync checked. Make sure staff names match the annual leave planner.");
    });

    // Receipts & Audit Modals
    document.getElementById("btnReceipts").addEventListener("click", async () => {
      const key = getMonthKey();
      const snap = await db.ref(`${DB_ROOT}/read_receipts/${key}`).once("value");
      const data = snap.val() || {};
      const body = document.getElementById("infoModalBody");
      document.getElementById("infoModalTitle").textContent = `Read Receipts (${key})`;
      const entries = Object.values(data);
      body.innerHTML = entries.length
        ? entries.map(r => `<div class="p-2 bg-slate-50 rounded border"><b>${r.username}</b> viewed <b>${r.version}</b> at ${new Date(r.timestamp).toLocaleString()}</div>`).join("")
        : "<p class='text-slate-500'>No read receipts recorded yet.</p>";
      document.getElementById("infoModal").classList.remove("hidden");
      document.getElementById("infoModal").classList.add("flex");
    });

    document.getElementById("btnAudit").addEventListener("click", async () => {
      const key = getMonthKey();
      const snap = await db.ref(`${DB_ROOT}/audit_log/${key}`).once("value");
      const data = snap.val() || {};
      const body = document.getElementById("infoModalBody");
      document.getElementById("infoModalTitle").textContent = `Audit Log (${key})`;
      const entries = Object.values(data).reverse();
      body.innerHTML = entries.length
        ? entries.map(a => `<div class="p-2 bg-slate-50 rounded border"><b>${a.by}</b>: ${a.action} <span class="text-slate-400">(${new Date(a.timestamp).toLocaleString()})</span></div>`).join("")
        : "<p class='text-slate-500'>No audit records yet.</p>";
      document.getElementById("infoModal").classList.remove("hidden");
      document.getElementById("infoModal").classList.add("flex");
    });

    // CSV Export
    document.getElementById("btnExportCSV").addEventListener("click", () => {
      const days = getDaysInMonth(selectedYear, selectedMonth);
      let csv = `Staff,${days.map(d => d.day).join(",")}\n`;
      rosterData.staff.forEach(p => {
        const row = days.map(d => (rosterData.assignments[p.id] && rosterData.assignments[p.id][d.day]) || "");
        csv += `"${p.name}",${row.join(",")}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${ROSTER_TITLE.replace(/\s+/g, "_")}_${getMonthKey()}.csv`;
      a.click();
    });
  </script>
</body>
</html>
